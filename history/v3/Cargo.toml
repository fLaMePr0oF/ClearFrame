[package]
name = "cleanframe"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Minimal offline image re-encoding and camera-capture simulation tool"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "bmp"] }
rfd = "=0.15.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
