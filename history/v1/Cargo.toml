[package]
name = "cleanframe"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Minimal desktop image re-encoder with subtle pixel processing and metadata removal"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp"] }
rfd = "0.15.4"
rand = { version = "0.8.5", features = ["small_rng"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
