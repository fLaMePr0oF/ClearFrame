name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Package executable and documentation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/cleanframe.exe dist/
          Copy-Item README.md, CHANGELOG.md dist/
          Get-FileHash dist/cleanframe.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  cleanframe.exe" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: CleanFrame-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30
